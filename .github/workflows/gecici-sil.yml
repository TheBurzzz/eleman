name: gecici-dal-sil
on:
  push:
    branches: [eleman]
    paths: ['.github/workflows/gecici-sil.yml']
permissions:
  contents: write
jobs:
  sil:
    runs-on: ubuntu-latest
    steps:
      - name: video-deneme dalını sil
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/video-deneme || echo "dal yok"
